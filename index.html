<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Foto Kenangan</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: monospace;
            padding: 20px;
            margin: 0;
        }
        h2 {
            color: #00ff66;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-box {
            background: #1a1b26;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2f3542;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            background: #0f111a;
            color: #fff;
            border: 1px solid #2f3542;
            border-radius: 4px;
            font-family: monospace;
        }
        button {
            background: #00ff66;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 12px;
        }
        button:hover {
            opacity: 0.9;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .card {
            background: #1a1b26;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2f3542;
            padding-bottom: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .card .info {
            padding: 8px;
        }
        .card p {
            margin: 0;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .date {
            color: gray;
            font-size: 10px;
            margin-top: 4px;
        }
        .del-btn {
            background: #ff5370;
            color: #fff;
            border: none;
            padding: 6px;
            width: calc(100% - 16px);
            margin: 0 auto;
            cursor: pointer;
            text-align: center;
            font-size: 10px;
            border-radius: 4px;
            font-family: monospace;
        }
        .empty-text {
            text-align: center;
            color: gray;
            grid-column: 1 / -1;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h2>VAULT FOTO KENANGAN</h2>

    <div class="form-box">
        <input type="text" id="photoTitle" placeholder="Judul Kenangan...">
        <input type="file" id="photoFile" accept="image/*">
        <button onclick="addPhoto()">SIMPAN KENANGAN</button>
    </div>

    <div class="grid" id="photoGrid">
        <!-- Foto akan muncul di sini secara otomatis -->
    </div>

    <script>
        let photos = JSON.parse(localStorage.getItem('memories')) || [];

        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';

            if (photos.length === 0) {
                grid.innerHTML = '<div class="empty-text">Belum ada kenangan tersimpan.</div>';
                return;
            }

            photos.forEach((photo, index) => {
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <img src="${photo.src}" alt="${photo.title}">
                            <div class="info">
                                <p><b>${photo.title}</b></p>
                                <p class="date">${photo.date}</p>
                            </div>
                        </div>
                        <button class="del-btn" onclick="deletePhoto(${index})">HAPUS</button>
                    </div>
                `;
            });
        }

        function addPhoto() {
            const titleInput = document.getElementById('photoTitle');
            const fileInput = document.getElementById('photoFile');

            if (!titleInput.value || fileInput.files.length === 0) {
                alert('Judul dan foto wajib diisi!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const newPhoto = {
                    title: titleInput.value,
                    src: e.target.result,
                    date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                };

                photos.unshift.push ? photos.unshift(newPhoto) : photos.push(newPhoto);
                localStorage.setItem('memories', JSON.stringify(photos));

                titleInput.value = '';
                fileInput.value = '';
                renderPhotos();
            };

            reader.readAsDataURL(file);
        }

        function deletePhoto(index) {
            if (confirm('Yakin mau hapus kenangan ini?')) {
                photos.splice(index, 1);
                localStorage.setItem('memories', JSON.stringify(photos));
                renderPhotos();
            }
        }

        // Load foto saat pertama kali dibuka
        renderPhotos();
    </script>

</body>
</html>
